version: 2

project_name: spinner

before:
  hooks:
    - go mod tidy

builds:
  - id: spinner
    main: ./main.go
    binary: spinner
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/rickihastings/spinner/internal/version.Version={{.Version}}
      - -X github.com/rickihastings/spinner/internal/version.Commit={{.Commit}}
      - -X github.com/rickihastings/spinner/internal/version.Date={{.Date}}

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"

release:
  github:
    owner: rickihastings
    name: spinner
  draft: false
  prerelease: auto
  name_template: "v{{.Version}}"
